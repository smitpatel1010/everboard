name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the leak check

      - name: Leak check (secrets and personal paths, all commits)
        run: scripts/leakcheck.sh --history

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build the app bundle
        run: scripts/build-app.sh debug
